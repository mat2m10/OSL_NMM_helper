name: Deploy web version to GitHub Pages

# The frontend in src/ is plain HTML + ES modules with no Rust logic, so it can
# be served as a static site.
#
# Before the first run, enable Pages in the repo settings:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# Then run this workflow from the Actions tab. Once Pages is enabled you can
# uncomment the push trigger to redeploy on every change to src/.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ["src/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
