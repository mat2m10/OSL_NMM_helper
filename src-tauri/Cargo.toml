[package]
name = "osl_nmm_helper"
version = "0.1.7"
description = "OSL NMM Helper desktop app"
authors = ["Matthieu de Hemptinne"]
edition = "2021"

[lib]
name = "osl_nmm_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
